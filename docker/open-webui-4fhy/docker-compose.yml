services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${TRAEFIK_SUBDOMAIN}.${TRAEFIK_HOST}`) || Host(`open-webui.weschance.com`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8080
    environment:
      ENABLE_OPENAI_API: 'true'
      WEBUI_URL: https://${TRAEFIK_SUBDOMAIN}.${TRAEFIK_HOST}
      ENABLE_WEB_SEARCH: 'true'
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: '5'
      SEARXNG_QUERY_URL: http://searxng:8080/search
      OPENAI_API_BASE_URL: https://router.hostinger.com/v1
      OPENAI_API_KEY: ${NEXOS_API_KEY:-}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - default
      - searxng-net

networks:
  searxng-net:
    external: true
    name: searxng-nfja_default

volumes:
  open-webui:
