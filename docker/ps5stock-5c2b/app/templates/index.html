<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Pro — Stock Monitor</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --panel2:#0f161e; --line:#233040;
    --txt:#e6edf5; --muted:#8ba0b6; --accent:#3b82f6;
    --in:#22c55e; --out:#64748b; --pre:#f59e0b; --bad:#ef4444; --warn:#eab308;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 20px 12px;border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  main{padding:20px;max-width:1080px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .retailer{font-weight:650}
  .prod{color:var(--muted);font-size:13px;margin-top:2px}
  .price{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .badge{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
         padding:4px 9px;border-radius:999px;white-space:nowrap}
  .b-in{background:rgba(34,197,94,.15);color:var(--in);border:1px solid rgba(34,197,94,.4)}
  .b-out{background:rgba(100,116,139,.15);color:var(--out);border:1px solid rgba(100,116,139,.4)}
  .b-pre{background:rgba(245,158,11,.15);color:var(--pre);border:1px solid rgba(245,158,11,.4)}
  .b-bad{background:rgba(239,68,68,.13);color:var(--bad);border:1px solid rgba(239,68,68,.4)}
  .b-warn{background:rgba(234,179,8,.13);color:var(--warn);border:1px solid rgba(234,179,8,.4)}
  .meta{margin-top:10px;font-size:12px;color:var(--muted);display:flex;
        justify-content:space-between;gap:8px;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:28px 0 10px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;
         font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .events{display:flex;flex-direction:column;gap:0}
  .ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ev time{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .pill{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--in);
       margin-right:6px;vertical-align:middle}
  .dot.off{background:var(--bad)}
  footer{color:var(--muted);font-size:12px;padding:24px 20px;text-align:center}
</style>
</head>
<body>
<header>
  <div>
    <h1>PS5 Pro — Stock Monitor</h1>
    <div class="sub" id="sub">loading…</div>
  </div>
  <button id="check">Check now</button>
</header>
<main>
  <div class="grid" id="sources"></div>

  <h2>Stock events</h2>
  <div class="card events" id="events"></div>
</main>
<footer>Polling every <span id="iv">—</span>. Status reflects this VPS's direct view of each retailer.</footer>

<script>
const cls = s => ({in_stock:'b-in',preorder:'b-pre',out_of_stock:'b-out',
  backorder:'b-warn',blocked:'b-bad',error:'b-bad',unknown:'b-warn',
  skipped:'b-out'}[s] || 'b-out');
const label = s => ({in_stock:'In stock',preorder:'Pre-order',out_of_stock:'Out of stock',
  backorder:'Backorder',blocked:'Blocked',error:'Error',unknown:'Unknown',
  skipped:'Skipped'}[s] || s);
const money = p => (typeof p === 'number') ? '$'+p.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = iso => {
  if(!iso) return 'never';
  const d = (Date.now() - new Date(iso).getTime())/1000;
  if (d < 60) return Math.max(0,Math.round(d))+'s ago';
  if (d < 3600) return Math.round(d/60)+'m ago';
  if (d < 86400) return Math.round(d/3600)+'h ago';
  return Math.round(d/86400)+'d ago';
};

async function load(){
  let d;
  try { d = await (await fetch('/api/status',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('sub').textContent = 'failed to load status'; return; }

  const alertDot = d.alerts_configured
    ? '<span class="dot"></span>alerts on'
    : '<span class="dot off"></span>alerts off';
  document.getElementById('sub').innerHTML =
    `Last check ${ago(d.last_run)} &nbsp;·&nbsp; ${alertDot}`;
  document.getElementById('iv').textContent = d.interval + 's';

  document.getElementById('sources').innerHTML = (d.sources||[]).map(s => `
    <div class="card">
      <div class="row">
        <div>
          <div class="retailer">${esc(s.retailer)}</div>
          <div class="prod">${esc(s.product)}</div>
        </div>
        <span class="badge ${cls(s.status)}">${esc(label(s.status))}</span>
      </div>
      <div class="meta">
        <span>${money(s.price)} ${s.detail?'· '+esc(s.detail):''}</span>
        <span>checked ${ago(s.ts)}</span>
      </div>
      <div class="meta"><a href="${esc(s.url)}" target="_blank" rel="noopener">open product page ↗</a></div>
    </div>`).join('') || '<div class="card">No automated sources configured.</div>';

  document.getElementById('events').innerHTML = (d.events||[]).map(e => `
    <div class="ev">
      <time>${new Date(e.ts).toLocaleString()}</time>
      <span class="pill ${cls(e.status)}">${esc(label(e.status))}</span>
      <span>${esc(e.retailer)} — ${esc(e.product)}</span>
    </div>`).join('') || '<div class="ev">No transitions recorded yet.</div>';
}

document.getElementById('check').onclick = async e => {
  const b = e.target; b.disabled = true; b.textContent = 'Checking…';
  try { await fetch('/api/check',{method:'POST'}); } catch(_) {}
  await load();
  b.disabled = false; b.textContent = 'Check now';
};

load();
setInterval(load, 30000);
</script>
</body>
</html>
